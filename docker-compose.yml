services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecomerce

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
